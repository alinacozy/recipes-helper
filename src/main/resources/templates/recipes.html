<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <meta charset="UTF-8">
    <title>Рецепты</title>
</head>
<body>
    <ul class="menu-main">
        <li><a href="/settings" >Профиль</a></li>
        <li><a href="/recipes" class="current">Рецепты</a></li>
        <li><a href="/history" >История приготовления</a></li>
        <li><a href="/products" >Мои продукты</a></li>
        <li><a href="/logout" >Выход</a></li>
    </ul>
    <h1>Рецепты</h1>

    <div class="filters-container">
        <form th:action="@{/recipes}" method="get">
            <!-- Фильтр по категории рецепта -->
            <div class="filter-group">
                <label for="recipeCategory">Категория рецепта:</label>
                <select id="recipeCategory" name="recipeCategory">
                    <option value="">Все категории</option>
                    <option th:each="category : ${T(com.example.recipes_helper.model.RecipeCategory).values()}"
                            th:value="${category}"
                            th:text="${category}"
                            th:selected="${param.recipeCategory != null && param.recipeCategory[0] == category.name()}">
                    </option>
                </select>
            </div>
            
            <!-- Фильтр по категории продукта -->
            <div class="filter-group">
                <label>Тип блюда:</label>
                <div class="radio-options">
                    <div class="radio-option">
                        <input type="radio" id="allProducts" name="productCategory" value="" 
                               th:checked="${param.productCategory == null || param.productCategory[0] == ''}">
                        <label for="allProducts">Любой тип</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="postnoe" name="productCategory" value="Постное"
                               th:checked="${param.productCategory != null && param.productCategory[0] == 'Постное'}">
                        <label for="postnoe">Постное</label>
                    </div>
                </div>
            </div>
            
            <!-- Фильтр "Доступные мне" -->
            <div class="filter-group">
                <div class="checkbox-options">
                    <div class="checkbox-option">
                        <input type="checkbox" id="available" name="available" value="true"
                               th:checked="${param.available != null && param.available[0] == 'true'}">
                        <label for="available">Доступные мне</label>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button type="submit">Применить фильтры</button>
                <a th:href="@{/recipes}" class="btn btn-reset">Сбросить фильтры</a>
            </div>
        </form>
    </div>
    
    <ul class="recipes-list">
        <li th:each="recipe : ${recipes}" class="recipe-item">
            <a th:href="@{'/recipes/' + ${recipe.recipeId}}" class="recipe-title" th:text="${recipe.recipeName}"></a>
            <p class="recipe-description" th:text="${recipe.description}"></p>
            <p class="recipe-category">
                Категория: <span th:text="${recipe.recipeCategory}"></span>
            </p>
        </li>
    </ul>
</body>
</html>
